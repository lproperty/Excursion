<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <title>Anti-coma Excursion</title>
    <link rel="stylesheet" href="assets/app.css" />
    <link rel="preconnect" href="https://data.busrouter.sg" crossorigin />
    <link rel="preconnect" href="https://assets.busrouter.sg" crossorigin />
    <link rel="preconnect" href="https://protomaps.github.io" crossorigin />
    <link rel="preconnect" href="https://arrivelah2.busrouter.sg" crossorigin />
    <meta
      name="description"
      content="Explore bus stops and routes on the map for all bus services in Singapore, with realtime bus arrival times and per-bus-stop passing routes overview."
    />
    <link rel="manifest" href="manifest.webmanifest" />
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="icons/icon-192.png"
    />
    <link rel="apple-touch-icon" href="icons/icon-pwa.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Anti-coma Excursion" />
    <meta name="theme-color" content="#F9F5ED" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:url"
      property="og:url"
      content="https://lproperty.github.io/Excursion/"
    />
    <meta
      name="twitter:title"
      property="og:title"
      content="Anti-coma Excursion"
    />
    <meta
      name="twitter:description"
      property="og:description"
      content="Explore bus stops and routes on the map for all bus services in Singapore, with realtime bus arrival times and per-bus-stop passing routes overview."
    />
    <meta
      name="twitter:image"
      property="og:image"
      content="https://i.imgur.com/Khk2gmX.png"
    />
  </head>
  <body>
    <div id="map"></div>

    <noscript>
      <p>Excursion only works with JavaScript</p>
    </noscript>
    <div id="app"></div>
    <div id="tooltip"></div>
    <script src="assets/app.js" type="module"></script>
  </body>
</html>
